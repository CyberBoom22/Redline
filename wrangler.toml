# Stage0 — public app deployment.
#
# Assets-only Worker: no Worker script, so requests are served straight from
# the built SPA. `not_found_handling = "single-page-application"` is what makes
# /admin and /admin/login survive a hard refresh — without it a static host
# returns 404 before React ever loads.
#
# One routed environment today:
#
#   stage0-preview       test.stage0.us    pre-production
#
#   bun run deploy:preview
#
# stage0.us is LIVE and reserved for production. Nothing in this file claims
# it, deliberately — a `custom_domain` route would attach the apex to this
# Worker on deploy and take over whatever is serving it now. The production
# block is written out at the bottom, commented, ready to enable when the
# cutover is intended.
#
# ── Do not run a bare `wrangler deploy` ─────────────────────────────────────
# Without `--env`, Wrangler deploys the *top-level* config as a third Worker
# named `stage0` with no route attached. That is how stray Workers accumulate.
# The npm scripts always pass --env; use them.
#
# Both environments are built from the same source but not the same bundle:
# VITE_* variables are inlined at build time, so each environment is built
# against its own .env file before it is deployed.

name = "stage0"
compatibility_date = "2026-09-08"

# Each environment is reachable at exactly one hostname. Leaving the
# *.workers.dev route on would publish a second, indexable copy of the app —
# and a second origin holding Supabase auth sessions.
workers_dev = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[observability]
enabled = true

# ── pre-production ──────────────────────────────────────────────────────────
# Deploys as `stage0-preview`.

[env.preview]
workers_dev = false

[env.preview.assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.preview.observability]
enabled = true

# Routes are not inherited from the top level; each environment declares its
# own. `custom_domain = true` has Wrangler create and manage the DNS record,
# so the only prerequisite is that the stage0.us zone is in this account.
[[env.preview.routes]]
pattern = "test.stage0.us"
custom_domain = true

# ── production — NOT ENABLED ────────────────────────────────────────────────
#
# stage0.us is live right now and reserved for the future production cutover.
# This block stays commented so no deploy from this repo can claim the apex
# and replace what is currently served there.
#
# To cut over: uncomment, confirm nothing else is bound to stage0.us, then
# `wrangler deploy --env production`. Re-add the deploy:prod script in
# package.json at the same time.
#
# [env.production]
# workers_dev = false
#
# [env.production.assets]
# directory = "./dist"
# not_found_handling = "single-page-application"
#
# [env.production.observability]
# enabled = true
#
# [[env.production.routes]]
# pattern = "stage0.us"
# custom_domain = true
