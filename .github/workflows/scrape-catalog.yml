name: Scrape parts catalog

# One run per day. The 100-request budget is enforced in the scraper itself and
# tracked in data/catalog/budget.json, which is committed back after each run —
# so a manual run and the scheduled run share the same daily allowance rather
# than each getting their own.
on:
  schedule:
    # Cron is UTC-only and does not follow daylight saving, so both offsets are
    # listed and the `gate` job below drops whichever one is not 03:00 in New
    # York today. That keeps the scan at 3am Eastern all year.
    - cron: '0 7 * * *' # 03:00 EDT (Mar-Nov)
    - cron: '0 8 * * *' # 03:00 EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap requests for this run (defaults to whatever the day has left)'
        required: false
        type: string
      only:
        description: 'Restrict to one vendor: ecs, fcp or z1'
        required: false
        type: string

# Never let two runs spend the budget concurrently.
concurrency:
  group: scrape-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Both cron entries fire year-round; only one of them is 3am in New York on
  # any given day. A manual run is never gated.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" = "03" ]; then
            echo "It is 03:00 in New York - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "It is ${hour}:00 in New York - this is the other DST schedule. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify scraper logic
        run: |
          bun run scrape:test
          bun run scrape:e2e

      - name: Scrape
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only=${{ inputs.only }}"; fi
          bun run scrape -- run $ARGS

      - name: Regenerate the catalog module
        run: bun run scrape:emit

      - name: Scan report
        run: bun run scrape:report

      - name: Report status
        run: bun run scrape:status

      # Ships the report to the D1-backed dashboard. Skipped automatically when
      # the variable is not configured, so the scrape still succeeds without it.
      - name: Push report to dashboard
        if: vars.REDLINE_DASHBOARD_URL != ''
        env:
          REDLINE_DASHBOARD_URL: ${{ vars.REDLINE_DASHBOARD_URL }}
          REDLINE_INGEST_SECRET: ${{ secrets.REDLINE_INGEST_SECRET }}
        run: bun run scrape:push

      - name: Commit catalog changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog src/data/scrapedCatalog.ts
          if git diff --staged --quiet; then
            echo "No catalog changes today."
            exit 0
          fi
          git commit -m "chore(catalog): daily scrape $(date -u +%Y-%m-%d)"
          # The scrape is slow; another push may have landed while it ran.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep $((2 ** attempt))
          done
          echo "Could not push catalog changes" >&2
          exit 1
